name: green-ridge

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://www.${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_SITE_URL: https://www.${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/id', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
